version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: channel_qna_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: channel_qna
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: channel_qna_app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/channel_qna
      SESSION_SECRET: docker-dev-session-secret
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data: